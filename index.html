            setView('landing');

              setShowBookingModal(false);
              setSelectedProfessional(null);

              setBookingTime("");

                      <div className="text-3xl font-bold text-slate-900">$2,450</div>
                   </Card>
                   <Card className="p-6 border-l-4 border-l-amber-500">
                      <div className="text-slate-500 text-sm font-medium mb-1">Pending Requests</div>
                      <div className="text-3xl font-bold text-slate-900">{requests.filter(r => r.status === 'pending').length}</div>
                   </Card>
                   <Card className="p-6 border-l-4 border-l-indigo-500">
                      <div className="text-slate-500 text-sm font-medium mb-1">Sessions Completed</div>
                      <div className="text-3xl font-bold text-slate-900">24</div>
                   </Card>
                </div>
                <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                  <div className="px-6 py-4 border-b border-gray-100 bg-gray-50/50 flex items-center justify-between">
                    <h3 className="font-bold text-slate-800">Booking Requests</h3>
                    <Button variant="ghost" className="!p-1 !text-sm">History</Button>
                  </div>
                  <div className="divide-y divide-gray-100">
                    {requests.length === 0 ? (
                      <div className="p-12 text-center text-gray-400">
                        <Calendar size={48} className="mx-auto mb-4 opacity-20" />
                        <p>No pending requests.</p>
                      </div>
                    ) : (
                      requests.map(request => (
                        <div key={request.id} className="p-6 hover:bg-slate-50 transition-colors">
                          <div className="flex flex-col md:flex-row md:items-center justify-between gap-6">
                            <div className="flex items-start gap-4">
                              <img src={request.candidateAvatar} alt={request.candidateName} className="w-12 h-12 rounded-full border border-white shadow-sm bg-gray-100" />
                              <div>
                                <div className="flex items-center gap-2 mb-1">
                                  <h4 className="font-bold text-slate-900">{request.candidateName}</h4>
                                  <span className="text-xs text-slate-500 px-2 py-0.5 bg-slate-100 rounded-full">{request.targetRole} Hopeful</span>
                                  <Badge status={request.status} />
                                </div>
                                <p className="text-sm text-slate-600 mb-2 max-w-xl">{request.message}</p>
                                <div className="flex items-center gap-4 text-sm text-slate-500">
                                  <div className="flex items-center gap-1"><Calendar size={14} />{request.date}</div>
                                  <div className="flex items-center gap-1"><Clock size={14} />{request.time}</div>
                                </div>
                              </div>
                            </div>
                            <div className="flex items-center gap-3 md:ml-auto">
                              {request.status === 'pending' && (
                                <>
                                  <Button variant="secondary" onClick={() => openRescheduleModal(request)} className="!py-2 !text-sm">Reschedule</Button>
                                  <Button variant="primary" onClick={() => handleAcceptRequest(request.id)} className="!py-2 !text-sm bg-blue-700 hover:bg-blue-800 focus:ring-blue-600" icon={CheckCircle}>Accept</Button>
                                </>
                              )}
                              {request.status === 'accepted' && (
                                 <div className="text-sm text-slate-500 flex items-center gap-2"><div className="w-2 h-2 rounded-full bg-emerald-500"></div>Scheduled</div>
                              )}
                               {request.status === 'rescheduling' && (
                                 <div className="text-sm text-slate-500 italic">Waiting for candidate...</div>
                              )}
                            </div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>
              </main>
            </div>
          );

          const Header = () => (
            <header className="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
              <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('landing')}>
                   <img src="Linsenlogo.png" alt="Linsen" className="h-8 w-auto object-contain" onError={(e) => {e.target.style.display='none'; e.target.nextSibling.style.display='flex'}} />
                   <div className="text-xl font-bold text-blue-900">Linsen</div>
                </div>
                <div className="flex items-center gap-4">
                  <div className="hidden md:flex flex-col items-end mr-2">
                    <span className="text-sm font-bold text-slate-900">{userRole === 'professional' ? 'Edo Linari' : 'Morten Haulik'}</span>
                    <span className="text-xs text-slate-500 uppercase tracking-wider">{userRole === 'professional' ? 'Professional (Mentor)' : 'Job Seeker'}</span>
                  </div>
                  <div className="h-9 w-9 rounded-full bg-slate-200 overflow-hidden border-2 border-white shadow-sm">
                     <img src={userRole === 'professional' ? AVATAR_EDO : AVATAR_MORTEN} alt="User" />
                  </div>
                  <button onClick={handleLogout} className="text-slate-400 hover:text-red-600 transition-colors p-2" title="Log Out"><LogOut size={20} /></button>
                </div>
              </div>
            </header>
          );

          // MODALS
          const SignUpModal = () => {
            if (!showSignUpModal) return null;
            return (
              <div className="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
                <div className="flex items-center justify-center min-h-screen px-4">
                  <div className="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity backdrop-blur-sm" onClick={() => setShowSignUpModal(false)}></div>
                  <div className="relative bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl z-10 animate-fade-in-up">
                    <div className="flex justify-between items-center mb-6">
                      <h3 className="text-2xl font-bold text-slate-900">Join Linsen</h3>
                      <button onClick={() => setShowSignUpModal(false)} className="text-gray-400 hover:text-gray-600"><X size={24}/></button>
                    </div>
                    <div className="space-y-4 mb-6">
                      <div className={`p-4 rounded-xl border-2 cursor-pointer transition-all ${signUpRole === 'candidate' ? 'border-blue-700 bg-blue-50' : 'border-gray-100 hover:border-gray-200'}`} onClick={() => setSignUpRole('candidate')}>
                        <div className="flex items-center gap-3">
                          <div className={`p-2 rounded-full ${signUpRole === 'candidate' ? 'bg-blue-700 text-white' : 'bg-gray-100 text-gray-400'}`}><Search size={20} /></div>
                          <div><div className="font-bold text-slate-900">I'm looking for a job</div><div className="text-sm text-slate-500">I want to book mentors for advice.</div></div>
                        </div>
                      </div>
                      <div className={`p-4 rounded-xl border-2 cursor-pointer transition-all ${signUpRole === 'professional' ? 'border-blue-700 bg-blue-50' : 'border-gray-100 hover:border-gray-200'}`} onClick={() => setSignUpRole('professional')}>
                        <div className="flex items-center gap-3">
                          <div className={`p-2 rounded-full ${signUpRole === 'professional' ? 'bg-blue-700 text-white' : 'bg-gray-100 text-gray-400'}`}><Briefcase size={20} /></div>
                          <div><div className="font-bold text-slate-900">I'm a Professional</div><div className="text-sm text-slate-500">I want to mentor and earn money.</div></div>
                        </div>
                      </div>
                    </div>
                    <div className="space-y-3">
                      <input type="text" placeholder="Full Name" className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                      <input type="email" placeholder="Email Address" className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                      <input type="password" placeholder="Password" className="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
                    </div>
                    <Button className="w-full mt-6" onClick={handleSignUp}>Create Account</Button>
                    <p className="text-center text-xs text-gray-500 mt-4">By joining, you agree to our Terms of Service.</p>
                  </div>
                </div>
              </div>
            );
          };

          const BookingModal = () => {
            if (!selectedProfessional && !showBookingModal) return null;
            if (!selectedProfessional) return null;
            return (
              <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                  <div className="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity backdrop-blur-sm" aria-hidden="true" onClick={() => setSelectedProfessional(null)}></div>
                  <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                  <div className="relative inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-2xl w-full">
                    <div className="absolute top-4 right-4 z-10"><button type="button" className="bg-white rounded-full p-2 text-gray-400 hover:text-gray-500 hover:bg-gray-100 transition-colors" onClick={() => setSelectedProfessional(null)}><X size={20} /></button></div>
                    <div className="flex flex-col sm:flex-row">
                       <div className="bg-slate-50 p-6 sm:w-1/3 border-r border-slate-100 flex flex-col items-center text-center">
                          <img src={selectedProfessional.avatar} className="w-24 h-24 rounded-full mb-4 shadow-md bg-white p-1" alt="" />
                          <h3 className="text-lg font-bold text-slate-900">{selectedProfessional.name}</h3>
                          <div className="text-sm font-medium text-slate-500 mb-1">{selectedProfessional.role}</div>
                          <div className="text-sm font-bold text-blue-800 mb-4">{selectedProfessional.company}</div>
                          <div className="w-full space-y-3 text-left mt-2">
                            <div className="flex items-center justify-between text-sm"><span className="text-slate-500">Rate</span><span className="font-bold text-slate-900">${selectedProfessional.rate}</span></div>
                            <div className="flex items-center justify-between text-sm"><span className="text-slate-500">Location</span><span className="font-medium text-slate-700">{selectedProfessional.location.split(',')[0]}</span></div>
                          </div>
                       </div>
                       <div className="p-6 sm:w-2/3">
                          {!showBookingModal ? (
                            <>
                              <h4 className="text-lg font-bold text-slate-900 mb-2">Mentor Profile</h4>
                              <p className="text-slate-600 text-sm mb-6 leading-relaxed">{selectedProfessional.bio}</p>
                              <div className="mb-6"><h4 className="text-sm font-bold text-slate-900 mb-2">Can help with:</h4><div className="flex flex-wrap gap-2">{selectedProfessional.skills.map(s => <span key={s} className="text-xs bg-blue-50 text-blue-800 px-2 py-1 rounded border border-blue-100">{s}</span>)}</div></div>
                              <div className="bg-amber-50 border border-amber-100 rounded-lg p-3 mb-6 flex gap-3 items-start"><Star className="text-amber-500 shrink-0 mt-0.5" size={16} /><p className="text-xs text-amber-800">"Highly recommended! {selectedProfessional.name} gave me specific feedback that helped me land the interview."</p></div>
                              <Button onClick={() => setShowBookingModal(true)} className="w-full" variant="primary" icon={Coffee}>Book Coffee Chat</Button>
                            </>
                          ) : (
                            <div className="animate-fade-in">
                               <h4 className="text-lg font-bold text-slate-900 mb-1">Schedule Meeting</h4>
                               <p className="text-sm text-slate-500 mb-6">Select a time for your 1:1 video call.</p>
                               <div className="space-y-4 mb-6">
                                  <div><label className="block text-sm font-medium text-slate-700 mb-1">Date</label><input type="date" className="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border outline-none" value={bookingDate} onChange={(e) => setBookingDate(e.target.value)} /></div>
                                  <div><label className="block text-sm font-medium text-slate-700 mb-1">Time</label><select className="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2.5 border outline-none" value={bookingTime} onChange={(e) => setBookingTime(e.target.value)}><option value="">Select time...</option><option value="09:00">09:00 AM</option><option value="12:00">12:00 PM</option><option value="15:00">03:00 PM</option><option value="17:00">05:00 PM</option></select></div>
                               </div>
                               <div className="bg-slate-50 p-4 rounded-lg mb-6">
                                  <div className="flex justify-between items-center mb-2"><span className="text-sm text-slate-600">Mentorship Fee</span><span className="font-medium text-slate-900">${selectedProfessional.rate}.00</span></div>
                                  <div className="flex justify-between items-center text-sm text-slate-600"><span>Service Fee</span><span>$5.00</span></div>
                                  <div className="border-t border-slate-200 mt-2 pt-2 flex justify-between items-center font-bold text-slate-900"><span>Total</span><span>${selectedProfessional.rate + 5}.00</span></div>
                               </div>
                               <div className="flex gap-3"><Button variant="secondary" onClick={() => setShowBookingModal(false)} className="flex-1">Back</Button><Button variant="primary" onClick={handleBookMeeting} className="flex-1" icon={DollarSign}>Pay & Confirm</Button></div>
                            </div>
                          )}
                       </div>
                    </div>
                  </div>
                </div>
              </div>
            );
          };

          const RescheduleModal = () => {
            if (!showRescheduleModal) return null;
            return (
              <div className="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
                <div className="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
                  <div className="fixed inset-0 bg-slate-900 bg-opacity-75 transition-opacity backdrop-blur-sm" aria-hidden="true" onClick={() => setShowRescheduleModal(false)}></div>
                  <span className="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
                  <div className="relative inline-block align-bottom bg-white rounded-xl px-4 pt-5 pb-4 text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-md w-full sm:p-6">
                     <div className="mb-4"><h3 className="text-lg leading-6 font-medium text-slate-900">Propose New Time</h3><p className="text-sm text-slate-500">Suggest a new time for your chat with {activeRequest?.candidateName}.</p></div>
                     <div className="space-y-4 mb-6">
                        <div><label className="block text-sm font-medium text-slate-700 mb-1">New Date</label><input type="date" className="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none" value={rescheduleDate} onChange={(e) => setRescheduleDate(e.target.value)} /></div>
                        <div><label className="block text-sm font-medium text-slate-700 mb-1">New Time</label><input type="time" className="w-full border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500 p-2 border outline-none" value={rescheduleTime} onChange={(e) => setRescheduleTime(e.target.value)} /></div>
                     </div>
                     <div className="flex justify-end gap-3"><Button variant="ghost" onClick={() => setShowRescheduleModal(false)}>Cancel</Button><Button variant="primary" onClick={handleSubmitReschedule}>Send Proposal</Button></div>
                  </div>
                </div>
              </div>
            );
          };

          const Toast = () => {
            if (!toast) return null;
            return (
              <div className="fixed bottom-4 right-4 z-50 animate-fade-in-up">
                <div className={`rounded-lg shadow-lg p-4 text-white flex items-center gap-3 ${toast.type === 'error' ? 'bg-red-600' : 'bg-blue-800'}`}>
                   {toast.type === 'error' ? <XCircle size={20}/> : <CheckCircle size={20} />}
                   <span className="font-medium">{toast.message}</span>
                </div>
              </div>
            );
          };

          return (
            <div className="font-sans text-slate-900 bg-white min-h-screen">
              {view === 'landing' && <LandingView />}
              {view === 'candidate-browse' && <CandidateBrowseView />}
              {view === 'professional-dashboard' && <ProfessionalDashboardView />}
              <BookingModal />
              <RescheduleModal />
              <SignUpModal />
              <Toast />
            </div>
          );
        }

        // --- MOUNT THE APP ---
        const rootElement = document.getElementById('root');
        const root = createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
